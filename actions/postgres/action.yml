name: postgres
description: >
  Starts a throwaway Postgres reachable at 127.0.0.1:<port> of this job. On our
  runners a job runs inside the runner container, so `services:` with published
  ports would land on the daemon's host, not on the job's localhost; this
  container joins the runner container's network namespace instead. Removed
  after the job (label gh-runner-job, see gh-runners job-completed.sh).

inputs:
  image:
    default: pgvector/pgvector:0.8.2-pg17
  user:
    default: postgres
  password:
    default: postgres
  database:
    default: postgres
  port:
    default: "5432"

outputs:
  url:
    description: postgres://user:password@127.0.0.1:port/database
    value: ${{ steps.start.outputs.url }}

runs:
  using: composite
  steps:
    - id: start
      shell: bash
      run: |
        name="pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(hostname)"
        docker rm -f "$name" >/dev/null 2>&1 || true
        docker run -d --name "$name" --label gh-runner-job=1 \
          --network "container:$(hostname)" \
          -e POSTGRES_USER='${{ inputs.user }}' -e POSTGRES_PASSWORD='${{ inputs.password }}' -e POSTGRES_DB='${{ inputs.database }}' \
          -e PGPORT='${{ inputs.port }}' \
          '${{ inputs.image }}' >/dev/null
        for _ in $(seq 1 60); do
          if docker exec "$name" pg_isready -h 127.0.0.1 -p '${{ inputs.port }}' -U '${{ inputs.user }}' -d '${{ inputs.database }}' -q; then
            echo "url=postgres://${{ inputs.user }}:${{ inputs.password }}@127.0.0.1:${{ inputs.port }}/${{ inputs.database }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 1
        done
        docker logs "$name" | tail -20
        echo "postgres did not become ready" >&2
        exit 1
