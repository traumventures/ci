name: rust-cache
description: >
  Cargo's target directory kept between jobs, with incremental builds, for
  jobs that run cargo themselves (the rust and typescript workflows use the
  same setup). A drop-in for Swatinem/rust-cache: <workspace>/<target> stays
  where cargo expects it, so paths like target/debug/<bin> or
  target/llvm-cov-target keep working.

  On our self-hosted runners the target directory lives in the runners'
  persistent cache directory on the host (a link, see the README, "Caches"):
  nothing is uploaded or downloaded. Each repository and key has a few lanes;
  a job holds one lane exclusively until it ends, so concurrent jobs never
  share a target directory. Cargo builds there through CARGO_TARGET_DIR (the
  same path on every runner). source-mtimes dates unchanged sources back to
  the passing build that produced the lane, so a run rebuilds only crates
  whose inputs changed; after a build from another runner's checkout path the
  workspace crates rebuild (their CARGO_MANIFEST_DIR changed). Cargo's registry and git checkouts are the runner's own
  persistent ~/.cargo.

  On GitHub-hosted runners (public repositories): Swatinem/rust-cache, saved
  by main only.

    - uses: traumventures/ci/actions/rust-cache@v1
      with:
        key: quality            # one cache per distinct build (profile, features, tool)
        workspace: .            # the Cargo workspace
        target: target          # its target directory, relative to the workspace

inputs:
  key:
    description: names the cache within the repository; jobs building differently need different keys
    required: true
  workspace:
    description: the Cargo workspace directory, relative to the repository root
    default: "."
  target:
    description: the target directory, relative to the workspace
    default: target
  incremental:
    description: >
      "true" keeps cargo's profile default (dev/test: workspace crates
      incremental, fast rebuilds of changed crates, roughly doubles the size;
      CARGO_INCREMENTAL stays unset); "false" sets CARGO_INCREMENTAL=0, for
      builds that rarely rebuild the same crates incrementally (coverage,
      mutation testing)
    default: "true"
  max-gb:
    description: (self-hosted) a lane's target directory is dropped (one cold build) once it holds more
    default: "40"
  lanes:
    description: (self-hosted) target directories per repository and key, i.e. how many jobs with this key run at once without waiting
    default: "2"
  sccache:
    description: (self-hosted) "true" compiles through sccache when the runner has it (see the README, "Caches")
    default: "true"

outputs:
  dir:
    description: (self-hosted) the lane directory; empty on GitHub-hosted runners
    value: ${{ steps.lane.outputs.dir }}

runs:
  using: composite
  steps:
    - id: lane
      name: Target directory (persistent lane)
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        TARGET: ${{ inputs.workspace }}/${{ inputs.target }}
        INCREMENTAL: ${{ inputs.incremental }}
        MAX_GB: ${{ inputs.max-gb }}
        LANES: ${{ inputs.lanes }}
        SCCACHE: ${{ inputs.sccache }}
      run: '"$GITHUB_ACTION_PATH/lane.sh"'
    - if: runner.environment == 'self-hosted' && steps.lane.outputs.persistent == 'true'
      uses: traumventures/ci/actions/source-mtimes@v1
      with:
        manifest: ${{ steps.lane.outputs.dir }}/source-mtimes
        # The files git tracks at the workspace: a nested checkout of another
        # repository (open-traummail/) has its own index.
        repository: ${{ inputs.workspace }}
    - if: runner.environment != 'self-hosted'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspace }} -> ${{ inputs.target }}
        key: ${{ inputs.key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
