name: source-mtimes
description: >
  Lets a build tool that judges freshness by file mtime (cargo, make, tsc
  --incremental) reuse a build directory kept between jobs. A fresh checkout
  dates every file to the checkout, so cargo rebuilt every workspace crate on
  every run although its target directory survived. The post step of a
  passing job records the git blob id and mtime of every tracked file next to
  the build directory; the main step puts back the recorded mtime for every
  file whose content (blob id) is unchanged, and removes the record: the
  build directory changes in place from then on, so a failed or cancelled
  job leaves no record and the next one rebuilds the workspace. Changed, new
  and locally edited files keep the checkout time and rebuild. A file is only
  ever dated back to the build that compiled exactly its content.

  The build directory must be used by one job at a time (actions/rust-cache
  holds a lock on it until the job ends).

    - uses: traumventures/ci/actions/source-mtimes@v1
      with: { manifest: /path/next/to/target/source-mtimes }

inputs:
  manifest:
    description: file next to the build directory that holds the recorded mtimes
    required: true
  repository:
    description: >
      the directory whose tracked files are covered, relative to the job's
      workspace (also right inside a container job, where the github.workspace
      context names the host path)
    default: "."

runs:
  using: node24
  main: index.mjs
  post: index.mjs
  # Only a passing job's build state is worth recording.
  post-if: success()
