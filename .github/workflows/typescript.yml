name: typescript

# Bun/TypeScript checks of one package directory: install with the frozen
# lockfile, then typecheck, lint, test and build. Each step defaults to
# "auto": run the package.json script of that name if it exists (typecheck
# falls back to `bun check`, Bun's native tsc-compatible checker, when there
# is a tsconfig.json), else skip
# (`bun run --if-present test` would fall through to /usr/bin/test). Override
# a step with a command, or "" to skip it.
#
#   jobs:
#     typescript:
#       uses: traumventures/ci/.github/workflows/typescript.yml@v1

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      bun-version:
        description: Bun version; the org standard is 1.4.3 (a repository's .bun-version or packageManager bun@ wins)
        type: string
        default: ""
      install:
        type: string
        default: bun install --frozen-lockfile
      typecheck:
        type: string
        default: auto
      lint:
        type: string
        default: auto
      test:
        type: string
        default: auto
      build:
        type: string
        default: auto
      submodules:
        type: string
        default: "false"
      runner:
        description: runs-on as JSON
        type: string
        default: '["blacksmith-4vcpu-ubuntu-2404"]'

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}
      - name: Bun version
        id: bun
        run: |
          version="${{ inputs.bun-version }}"
          if [ -z "$version" ] && [ -f .bun-version ]; then version=$(tr -d '[:space:]' < .bun-version); fi
          if [ -z "$version" ] && [ -f package.json ]; then version=$(jq -r '.packageManager // "" | select(startswith("bun@")) | sub("^bun@"; "")' package.json); fi
          echo "version=${version:-1.4.3}" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Install
        if: inputs.install != ''
        run: ${{ inputs.install }}
      - name: Typecheck
        if: inputs.typecheck != ''
        env:
          COMMAND: ${{ inputs.typecheck }}
        run: |
          if [ "$COMMAND" = auto ]; then
            if jq -e '.scripts["typecheck"]' package.json >/dev/null 2>&1; then bun run typecheck
            elif [ -f tsconfig.json ]; then bun check
            else echo "no typecheck script and no tsconfig.json, skipped"; fi
          else
            bash -ec "$COMMAND"
          fi
      - name: Lint
        if: inputs.lint != ''
        env:
          COMMAND: ${{ inputs.lint }}
        run: |
          if [ "$COMMAND" = auto ]; then
            if jq -e '.scripts["lint"]' package.json >/dev/null 2>&1; then bun run lint; else echo "no lint script, skipped"; fi
          else
            bash -ec "$COMMAND"
          fi
      - name: Test
        if: inputs.test != ''
        env:
          COMMAND: ${{ inputs.test }}
        run: |
          if [ "$COMMAND" = auto ]; then
            if jq -e '.scripts["test"]' package.json >/dev/null 2>&1; then bun run test; else echo "no test script, skipped"; fi
          else
            bash -ec "$COMMAND"
          fi
      - name: Build
        if: inputs.build != ''
        env:
          COMMAND: ${{ inputs.build }}
        run: |
          if [ "$COMMAND" = auto ]; then
            if jq -e '.scripts["build"]' package.json >/dev/null 2>&1; then bun run build; else echo "no build script, skipped"; fi
          else
            bash -ec "$COMMAND"
          fi
