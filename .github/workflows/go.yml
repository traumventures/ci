name: go

# Go checks of one module: gofmt, go vet, tests (with the race detector).
#
# Skips draft pull requests, and every step after checkout when this job
# already passed with the same tree and inputs (actions/green). On our
# runners the module and build caches persist on the host; GitHub-hosted
# runners (public repositories) use setup-go's Actions cache.
#
#   jobs:
#     go:
#       uses: traumventures/ci/.github/workflows/go.yml@v1

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      test:
        type: string
        default: go test -race ./...
      submodules:
        type: string
        default: "false"
      runner:
        description: >
          runs-on as JSON; default: our runners ["self-hosted","traumventures","devbox"]
          for private repositories, "ubuntu-latest" for public ones (see the README, "Runners")
        type: string
        default: ""
      skip-unchanged:
        description: skip when this job already passed with the same tree and inputs
        type: boolean
        default: true
      inputs-paths:
        description: pathspecs that decide the result (space separated); default the whole repository
        type: string
        default: "."

# No `permissions:` of its own: a called workflow can only narrow what its
# caller grants. The caller's `contents: read` + `actions: read` (the green
# lookup lists artifacts) apply; without `actions: read` nothing is skipped.

jobs:
  go:
    if: github.event.pull_request.draft != true
    runs-on: ${{ fromJSON(inputs.runner != '' && inputs.runner || (github.event.repository.visibility == 'public' && '"ubuntu-latest"' || '["self-hosted","traumventures","devbox"]')) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: ${{ inputs.submodules }}
      - id: green
        uses: traumventures/ci/actions/green@v1
        with:
          mode: lookup
          config: ${{ toJSON(inputs) }}
          paths: ${{ inputs.inputs-paths }}
          enabled: ${{ inputs.skip-unchanged }}
      - uses: actions/setup-go@v5
        if: steps.green.outputs.hit != 'true'
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
          # Our runners keep the caches on the host (next step).
          cache: ${{ runner.environment != 'self-hosted' }}
      - name: Go caches (persistent)
        if: steps.green.outputs.hit != 'true' && runner.environment == 'self-hosted'
        run: |
          # Go's module and build caches are safe for concurrent jobs.
          dir="${CI_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/traumventures-ci}/go"
          mkdir -p "$dir/mod" "$dir/build"
          echo "GOMODCACHE=$dir/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=$dir/build" >> "$GITHUB_ENV"
      - name: gofmt
        if: steps.green.outputs.hit != 'true'
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^vendor/') || true)
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        if: steps.green.outputs.hit != 'true'
        run: go vet ./...
      - name: Test
        if: steps.green.outputs.hit != 'true' && inputs.test != ''
        run: ${{ inputs.test }}
      - if: steps.green.outputs.hit != 'true'
        uses: traumventures/ci/actions/green@v1
        with:
          mode: save
          key: ${{ steps.green.outputs.key }}
          enabled: ${{ inputs.skip-unchanged }}
