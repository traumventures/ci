name: docker

# Builds one image and, when push is true, publishes it to the Scaleway
# registry as rg.fr-par.scw.cloud/traumventures/<repository>/<image>:
#   - a tag v1.2.3 publishes :1.2.3 and :<commit sha>
#   - any other pushed ref publishes :<commit sha>
# Pull requests call it with push: false (build check only).
#
# On our runners the image is built by the runners' Docker daemon itself
# (the `docker` buildx driver): its build cache persists on the host, nothing
# is uploaded, and the built image is removed from the daemon afterwards.
# GitHub-hosted runners (public repositories) use a buildx builder with the
# Actions cache. A build check (push: false) skips draft pull requests and an
# unchanged tree (actions/green); a publishing build always runs.
#
#   jobs:
#     docker:
#       uses: traumventures/ci/.github/workflows/docker.yml@v1
#       with:
#         image: my-service
#         push: ${{ github.event_name != 'pull_request' }}
#       secrets: inherit        # SCW_REGISTRY_PUSH_KEY of the repository

on:
  workflow_call:
    inputs:
      image:
        description: image name below traumventures/<repository>/
        type: string
        required: true
      context:
        type: string
        default: "."
      dockerfile:
        description: path of the Dockerfile; default <context>/Dockerfile
        type: string
        default: ""
      target:
        type: string
        default: ""
      build-args:
        type: string
        default: ""
      platforms:
        description: the production hosts are x86_64
        type: string
        default: linux/amd64
      push:
        type: boolean
        default: false
      submodules:
        type: string
        default: "false"
      runner:
        description: >
          runs-on as JSON; default: our runners ["self-hosted","traumventures","devbox"]
          for private repositories, "ubuntu-latest" for public ones (see the README, "Runners")
        type: string
        default: ""
      skip-unchanged:
        description: (push false only) skip when this build already passed with the same tree and inputs
        type: boolean
        default: true
      inputs-paths:
        description: pathspecs that decide the result (space separated); default the whole repository
        type: string
        default: "."
    secrets:
      SCW_REGISTRY_PUSH_KEY:
        required: false
    outputs:
      digest:
        value: ${{ jobs.docker.outputs.digest }}

# No `permissions:` of its own: a called workflow can only narrow what its
# caller grants. The caller's `contents: read` + `actions: read` (the green
# lookup lists artifacts) apply; without `actions: read` nothing is skipped.

jobs:
  docker:
    if: inputs.push || github.event.pull_request.draft != true
    runs-on: ${{ fromJSON(inputs.runner != '' && inputs.runner || (github.event.repository.visibility == 'public' && '"ubuntu-latest"' || '["self-hosted","traumventures","devbox"]')) }}
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: ${{ inputs.submodules }}
      - id: green
        uses: traumventures/ci/actions/green@v1
        with:
          mode: lookup
          config: ${{ toJSON(inputs) }}
          paths: ${{ inputs.inputs-paths }}
          enabled: ${{ inputs.skip-unchanged && !inputs.push }}
      # Our runners: the daemon's default builder (docker driver), whose
      # cache persists. GitHub-hosted: a buildx builder with the Actions cache.
      - if: steps.green.outputs.hit != 'true' && runner.environment != 'self-hosted'
        uses: docker/setup-buildx-action@v3
      - name: Log in to the registry
        if: steps.green.outputs.hit != 'true' && inputs.push
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_REGISTRY_PUSH_KEY }}
      - name: Image name
        id: name
        if: steps.green.outputs.hit != 'true'
        run: echo "image=rg.fr-par.scw.cloud/traumventures/${GITHUB_REPOSITORY#*/}/${{ inputs.image }}" >> "$GITHUB_OUTPUT"
      - name: Tags and labels
        id: meta
        if: steps.green.outputs.hit != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=
      - name: Build${{ inputs.push && ' and push' || '' }}
        id: build
        if: steps.green.outputs.hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The daemon's builder keeps its cache itself; GitHub-hosted: the Actions cache.
          cache-from: ${{ runner.environment != 'self-hosted' && format('type=gha,scope={0}', inputs.image) || '' }}
          cache-to: ${{ runner.environment != 'self-hosted' && format('type=gha,mode=max,scope={0}', inputs.image) || '' }}
      # The build loaded the image into the daemon our runners share; its
      # layers stay in the build cache, the tags would only pile up.
      - name: Remove the image from the runner's daemon
        if: always() && runner.environment == 'self-hosted' && steps.meta.outputs.tags != ''
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: printf '%s\n' "$TAGS" | xargs -r docker image rm >/dev/null 2>&1 || true
      - if: steps.green.outputs.hit != 'true'
        uses: traumventures/ci/actions/green@v1
        with:
          mode: save
          key: ${{ steps.green.outputs.key }}
          enabled: ${{ inputs.skip-unchanged && !inputs.push }}
