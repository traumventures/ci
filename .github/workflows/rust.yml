name: rust

# Rust checks of one Cargo workspace: rustfmt, Clippy with warnings as errors,
# tests, all with the locked dependency set. The toolchain comes from
# rust-toolchain.toml when present, else stable.
#
# Skips draft pull requests, and every step after checkout when this job
# already passed with the same tree and inputs (actions/green). On Blacksmith
# the target directory and cargo's registry live on a sticky disk with
# incremental compilation, so a run rebuilds what changed; only main commits
# the disk, pull requests start from main's snapshot and discard their writes.
# Other runners keep Swatinem/rust-cache, saved by main only.
#
#   jobs:
#     rust:
#       uses: traumventures/ci/.github/workflows/rust.yml@v1

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      fmt:
        type: string
        default: cargo fmt --all --check
      clippy:
        type: string
        default: cargo clippy --locked --workspace --all-targets -- -D warnings
      test:
        type: string
        default: cargo test --locked --workspace
      apt-packages:
        description: extra Debian packages the build needs (e.g. protobuf-compiler)
        type: string
        default: ""
      submodules:
        type: string
        default: "false"
      runner:
        type: string
        default: '["blacksmith-4vcpu-ubuntu-2404"]'
      skip-unchanged:
        description: skip when this job already passed with the same tree and inputs
        type: boolean
        default: true
      inputs-paths:
        description: pathspecs that decide the result (space separated); default the whole repository
        type: string
        default: "."

# No `permissions:` of its own: a called workflow can only narrow what its
# caller grants. The caller's `contents: read` + `actions: read` (the green
# lookup lists artifacts) apply; without `actions: read` nothing is skipped.

jobs:
  rust:
    if: github.event.pull_request.draft != true
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # Incremental only pays off with a persistent target directory.
      CARGO_INCREMENTAL: ${{ contains(inputs.runner, 'blacksmith') && '1' || '0' }}
      STICKY: /home/runner/.ci-rust
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          submodules: ${{ inputs.submodules }}
      - id: green
        uses: traumventures/ci/actions/green@v1
        with:
          mode: lookup
          config: ${{ toJSON(inputs) }}
          paths: ${{ inputs.inputs-paths }}
          enabled: ${{ inputs.skip-unchanged }}
      - name: System packages
        if: steps.green.outputs.hit != 'true' && inputs.apt-packages != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ${{ inputs.apt-packages }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.green.outputs.hit != 'true'
        with:
          components: rustfmt, clippy
      - name: Toolchain of the repository
        if: steps.green.outputs.hit != 'true'
        run: |
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup show active-toolchain || rustup toolchain install
            rustup component add rustfmt clippy
          fi
          rustc --version
      - name: Target and registry (sticky disk, committed by main only)
        if: steps.green.outputs.hit != 'true' && contains(inputs.runner, 'blacksmith')
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-rust-${{ inputs.working-directory }}-v1
          path: /home/runner/.ci-rust
          commit: ${{ github.event_name == 'pull_request' && 'false' || 'on-change' }}
      - name: Use the sticky disk
        if: steps.green.outputs.hit != 'true' && contains(inputs.runner, 'blacksmith')
        run: |
          set -euo pipefail
          sudo chown "$(id -u):$(id -g)" "$STICKY"
          mkdir -p "$STICKY/target" "$STICKY/registry" "$STICKY/git"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          for dir in registry git; do rm -rf "${cargo_home:?}/$dir"; ln -s "$STICKY/$dir" "$cargo_home/$dir"; done
          echo "CARGO_TARGET_DIR=$STICKY/target" >> "$GITHUB_ENV"
          # Bounded: stale incremental sessions and test binaries of removed
          # crates accumulate; past 80 % the next build starts cold once.
          used=$(df --output=pcent "$STICKY" | tail -1 | tr -dc '0-9')
          echo "sticky disk: $(df -h --output=used,size "$STICKY" | tail -1) used (${used}%)"
          if (( used > 80 )); then echo "::warning::sticky disk ${used}% full, target dropped"; rm -rf "${STICKY:?}/target"; mkdir "$STICKY/target"; fi
      - uses: Swatinem/rust-cache@v2
        if: steps.green.outputs.hit != 'true' && !contains(inputs.runner, 'blacksmith')
        with:
          workspaces: ${{ inputs.working-directory }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        if: steps.green.outputs.hit != 'true' && inputs.fmt != ''
        run: ${{ inputs.fmt }}
      - name: Clippy
        if: steps.green.outputs.hit != 'true' && inputs.clippy != ''
        run: ${{ inputs.clippy }}
      - name: Test
        if: steps.green.outputs.hit != 'true' && inputs.test != ''
        run: ${{ inputs.test }}
      - if: steps.green.outputs.hit != 'true'
        uses: traumventures/ci/actions/green@v1
        with:
          mode: save
          key: ${{ steps.green.outputs.key }}
          enabled: ${{ inputs.skip-unchanged }}
