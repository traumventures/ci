name: rust

# Rust checks of one Cargo workspace: rustfmt, Clippy with warnings as errors,
# tests, all with the locked dependency set. The toolchain comes from
# rust-toolchain.toml when present, else stable.
#
#   jobs:
#     rust:
#       uses: traumventures/ci/.github/workflows/rust.yml@v1

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      fmt:
        type: string
        default: cargo fmt --all --check
      clippy:
        type: string
        default: cargo clippy --locked --workspace --all-targets -- -D warnings
      test:
        type: string
        default: cargo test --locked --workspace
      apt-packages:
        description: extra Debian packages the build needs (e.g. protobuf-compiler)
        type: string
        default: ""
      submodules:
        type: string
        default: "false"
      runner:
        type: string
        default: '["self-hosted","traumventures"]'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}
      - name: System packages
        if: inputs.apt-packages != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ${{ inputs.apt-packages }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Toolchain of the repository
        run: |
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup show active-toolchain || rustup toolchain install
            rustup component add rustfmt clippy
          fi
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
      - name: Format
        if: inputs.fmt != ''
        run: ${{ inputs.fmt }}
      - name: Clippy
        if: inputs.clippy != ''
        run: ${{ inputs.clippy }}
      - name: Test
        if: inputs.test != ''
        run: ${{ inputs.test }}
