name: rust

# Rust checks of one Cargo workspace: rustfmt, Clippy with warnings as errors,
# tests, all with the locked dependency set. The toolchain comes from
# rust-toolchain.toml when present, else stable.
#
# Skips draft pull requests, and every step after checkout when this job
# already passed with the same tree and inputs (actions/green). On our
# runners the target directory persists on the host with incremental
# compilation and restored source mtimes, over an sccache of the
# dependencies (actions/rust-cache), so a run rebuilds only crates whose
# inputs changed. GitHub-hosted runners (public repositories) use
# Swatinem/rust-cache, saved by main only.
#
#   jobs:
#     rust:
#       uses: traumventures/ci/.github/workflows/rust.yml@v1

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      fmt:
        type: string
        default: cargo fmt --all --check
      clippy:
        type: string
        default: cargo clippy --locked --workspace --all-targets -- -D warnings
      test:
        type: string
        default: cargo test --locked --workspace
      apt-packages:
        description: extra Debian packages the build needs (e.g. protobuf-compiler)
        type: string
        default: ""
      submodules:
        type: string
        default: "false"
      runner:
        description: >
          runs-on as JSON; default: our runners ["self-hosted","traumventures","devbox"]
          for private repositories, "ubuntu-latest" for public ones (see the README, "Runners")
        type: string
        default: ""
      skip-unchanged:
        description: skip when this job already passed with the same tree and inputs
        type: boolean
        default: true
      inputs-paths:
        description: pathspecs that decide the result (space separated); default the whole repository
        type: string
        default: "."

# No `permissions:` of its own: a called workflow can only narrow what its
# caller grants. The caller's `contents: read` + `actions: read` (the green
# lookup lists artifacts) apply; without `actions: read` nothing is skipped.

jobs:
  rust:
    if: github.event.pull_request.draft != true
    runs-on: ${{ fromJSON(inputs.runner != '' && inputs.runner || (github.event.repository.visibility == 'public' && '"ubuntu-latest"' || '["self-hosted","traumventures","devbox"]')) }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: ${{ inputs.submodules }}
      - id: green
        uses: traumventures/ci/actions/green@v1
        with:
          mode: lookup
          config: ${{ toJSON(inputs) }}
          paths: ${{ inputs.inputs-paths }}
          enabled: ${{ inputs.skip-unchanged }}
      - name: System packages
        if: steps.green.outputs.hit != 'true' && inputs.apt-packages != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ${{ inputs.apt-packages }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.green.outputs.hit != 'true'
        with:
          components: rustfmt, clippy
      - name: Toolchain of the repository
        if: steps.green.outputs.hit != 'true'
        run: |
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup show active-toolchain || rustup toolchain install
            rustup component add rustfmt clippy
          fi
          rustc --version
      # Persistent target directory (one locked lane per job), restored
      # source mtimes and sccache on our runners; Swatinem/rust-cache on
      # GitHub-hosted ones.
      - name: Target directory and compile cache
        if: steps.green.outputs.hit != 'true'
        uses: traumventures/ci/actions/rust-cache@v1
        with:
          key: ${{ inputs.working-directory }}
          workspace: ${{ inputs.working-directory }}
      - name: Format
        if: steps.green.outputs.hit != 'true' && inputs.fmt != ''
        run: ${{ inputs.fmt }}
      - name: Clippy
        if: steps.green.outputs.hit != 'true' && inputs.clippy != ''
        run: ${{ inputs.clippy }}
      - name: Test
        if: steps.green.outputs.hit != 'true' && inputs.test != ''
        run: ${{ inputs.test }}
      - name: sccache statistics
        if: always() && steps.green.outputs.hit != 'true' && env.RUSTC_WRAPPER != ''
        run: sccache --show-stats || true
      - if: steps.green.outputs.hit != 'true'
        uses: traumventures/ci/actions/green@v1
        with:
          mode: save
          key: ${{ steps.green.outputs.key }}
          enabled: ${{ inputs.skip-unchanged }}
